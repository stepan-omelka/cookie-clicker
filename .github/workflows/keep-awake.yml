name: keep awake

on:
  schedule:
    # Weekdays 07:00-16:50 UTC (08-18 Prague time in winter, 09-19 in summer): about 220 of Render's 750 free
    # hours a month. Those hours are shared by every service in the workspace, so the rest stays for the others.
    - cron: "*/10 7-16 * * 1-5"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    if: vars.APP_URL != ''
    runs-on: ubuntu-latest
    steps:
      - name: Request the home page
        env:
          APP_URL: ${{ vars.APP_URL }}
        run: curl --fail --silent --show-error --max-time 120 --retry 2 --output /dev/null "$APP_URL/"
