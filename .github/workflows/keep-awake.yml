name: keep awake

on:
  schedule:
    # Daytime only: 06:00-21:50 UTC (07-23 Prague time in winter, 08-24 in summer). Render's 750 free hours a
    # month are shared by every service in the workspace; 24/7 would use them all and leave none for the others.
    - cron: "*/10 6-21 * * *"
  workflow_dispatch:

jobs:
  ping:
    if: vars.APP_URL != ''
    runs-on: ubuntu-latest
    steps:
      - name: Request the home page
        run: curl --fail --silent --show-error --max-time 120 --retry 2 --output /dev/null "${{ vars.APP_URL }}/"
