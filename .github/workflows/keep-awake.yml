name: keep awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    if: vars.APP_URL != ''
    runs-on: ubuntu-latest
    steps:
      - name: Request the home page
        env:
          APP_URL: ${{ vars.APP_URL }}
        run: curl --fail --silent --show-error --max-time 120 --retry 2 --output /dev/null "$APP_URL/"
