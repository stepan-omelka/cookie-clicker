name: keep awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    if: vars.APP_URL != ''
    runs-on: ubuntu-latest
    steps:
      - name: Request the home page
        run: curl --fail --silent --show-error --max-time 120 --retry 2 --output /dev/null "${{ vars.APP_URL }}/"
